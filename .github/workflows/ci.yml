name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x, 26.x]
        # Linux runs all three Node versions; macOS and Windows run 22.x only.
        # Remove the exclude block to test every version on every OS.
        exclude:
          - os: macos-latest
            node-version: 24.x
          - os: macos-latest
            node-version: 26.x
          - os: windows-latest
            node-version: 24.x
          - os: windows-latest
            node-version: 26.x

    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Run tests
      run: npm test
